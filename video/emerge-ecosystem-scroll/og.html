<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <style>
      @font-face { font-family: "Lexend"; font-weight: 400; font-display: block; src: url("assets/fonts/lexend-400.woff2") format("woff2"); }
      @font-face { font-family: "Lexend"; font-weight: 700; font-display: block; src: url("assets/fonts/lexend-700.woff2") format("woff2"); }
      @font-face { font-family: "Prompt"; font-weight: 600; font-display: block; src: url("assets/fonts/prompt-600.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { font-family: "Lexend", system-ui, sans-serif; color: #F7F9FC; -webkit-font-smoothing: antialiased; }
      #og { position: relative; width: 1200px; height: 630px; background: #06122A; }
      /* Money-shot constellation frame as the backdrop (center-cropped) */
      #og img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
      /* Legibility gradient: ink from the left + bottom */
      #og .scrim { position: absolute; inset: 0; background:
        linear-gradient(90deg, rgba(3,8,26,0.88) 0%, rgba(3,8,26,0.55) 42%, rgba(3,8,26,0.08) 75%),
        linear-gradient(0deg, rgba(3,8,26,0.72) 0%, transparent 40%); }
      .content { position: absolute; left: 64px; bottom: 56px; right: 64px; }
      .eyebrow { font-family: "Prompt", "Lexend", sans-serif; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 600; font-size: 19px; color: #3DDCE3; }
      .wordmark { margin-top: 14px; font-weight: 700; font-size: 78px; letter-spacing: -0.025em; line-height: 1.02; color: #fff; }
      .wordmark .teal { color: #00C2C7; }
      .tagline { margin-top: 14px; font-size: 27px; font-weight: 400; color: rgba(232,238,245,0.85); letter-spacing: -0.01em; }
      .domain { position: absolute; right: 0; bottom: 6px; display: inline-flex; align-items: center; gap: 10px;
        font-family: "Prompt", "Lexend", sans-serif; text-transform: uppercase; letter-spacing: 0.14em; font-size: 17px; color: #3DDCE3;
        border: 1.5px solid rgba(0,194,199,0.4); background: rgba(0,194,199,0.10); padding: 12px 22px; border-radius: 9999px; }
      .domain .dot { width: 8px; height: 8px; border-radius: 50%; background: #00C2C7; box-shadow: 0 0 12px #00C2C7; }
      .rule { position: absolute; left: 64px; right: 64px; bottom: 178px; height: 1px; background: linear-gradient(90deg, rgba(0,194,199,0.5), transparent 70%); }
    </style>
  </head>
  <body>
    <div id="og">
      <img class="bg" src="raw/frame-0106.png" alt="" />
      <div class="scrim"></div>
      <div class="content">
        <div class="eyebrow">Local Prime &nbsp;·&nbsp; Dubai Mainland &nbsp;·&nbsp; MEA</div>
        <div class="wordmark">Emerge <span class="teal">Digital</span></div>
        <div class="tagline">Local Prime. Global Power. Enterprise Outcomes.</div>
        <div class="domain"><span class="dot"></span>emergedigital.com</div>
      </div>
    </div>
  </body>
</html>
