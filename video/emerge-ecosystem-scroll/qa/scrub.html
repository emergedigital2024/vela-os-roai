<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrub review — emerge-ecosystem-scroll</title>
<style>
  body { margin: 0; background: #03081A; color: #F7F9FC; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  iframe { width: 1280px; height: 720px; border: 1px solid rgba(255,255,255,0.12); transform-origin: center; background: #03081A; }
  #bar { display: flex; gap: 16px; align-items: center; padding: 14px 20px; background: #06122A; border-top: 1px solid rgba(255,255,255,0.08); }
  input[type=range] { flex: 1; accent-color: #00C2C7; }
  #t { font-variant-numeric: tabular-nums; width: 130px; color: #9FAFC2; }
  .hint { color: #9FAFC2; font-size: 12px; }
  button { background: #0A1F3D; color: #F7F9FC; border: 1px solid rgba(0,194,199,0.4); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage"><iframe id="f" src="../index.html"></iframe></div>
  <div id="bar">
    <button id="play">▶ 1×</button>
    <input id="s" type="range" min="0" max="1" step="0.0005" value="0" />
    <span id="t">t=0.00s · p=0.000</span>
    <span class="hint">drag / wheel / arrow keys — park anywhere, scrub backwards. Review rule: every parked frame must look designed.</span>
  </div>
  <script>
    const DUR = 24;
    const f = document.getElementById("f"), s = document.getElementById("s"), t = document.getElementById("t");
    let tl = null;
    f.addEventListener("load", () => {
      const w = f.contentWindow;
      const wait = setInterval(() => {
        if (w.__timelines && w.__timelines["main"]) { tl = w.__timelines["main"]; tl.pause(); clearInterval(wait); apply(0); }
      }, 50);
      // fit the 1920×1080 stage into the 1280×720 iframe viewport
      const d = w.document.documentElement;
      d.style.transform = "scale(0.6667)"; d.style.transformOrigin = "0 0";
    });
    const apply = (p) => {
      if (!tl) return;
      tl.time(p * DUR, false);
      t.textContent = `t=${(p * DUR).toFixed(2)}s · p=${p.toFixed(3)}`;
    };
    s.addEventListener("input", () => apply(+s.value));
    window.addEventListener("wheel", (e) => { s.value = Math.min(1, Math.max(0, +s.value + e.deltaY * 0.0002)); apply(+s.value); }, { passive: true });
    window.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.001 : 0.01;
      if (e.key === "ArrowRight") { s.value = Math.min(1, +s.value + step); apply(+s.value); }
      if (e.key === "ArrowLeft")  { s.value = Math.max(0, +s.value - step); apply(+s.value); }
    });
    let raf = null;
    document.getElementById("play").addEventListener("click", () => {
      if (raf) { cancelAnimationFrame(raf); raf = null; return; }
      let last = performance.now();
      const tick = (now) => {
        const dt = (now - last) / 1000; last = now;
        s.value = Math.min(1, +s.value + dt / DUR);
        apply(+s.value);
        if (+s.value < 1) raf = requestAnimationFrame(tick); else raf = null;
      };
      raf = requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
