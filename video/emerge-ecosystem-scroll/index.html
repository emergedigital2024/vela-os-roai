<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Vendored GSAP — this composition must render fully offline (deterministic frame export). -->
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Local brand fonts (offline-render safe). Frames are typography-free by design —
         fonts exist only for the ED logo tile and any temp draft-review captions. */
      @font-face { font-family: "Lexend"; font-weight: 400; font-display: block; src: url("assets/fonts/lexend-400.woff2") format("woff2"); }
      @font-face { font-family: "Lexend"; font-weight: 700; font-display: block; src: url("assets/fonts/lexend-700.woff2") format("woff2"); }
      @font-face { font-family: "Lexend Zetta"; font-weight: 700; font-display: block; src: url("assets/fonts/lexendzetta-700.woff2") format("woff2"); }

      :root {
        --bg: #06122A; --bg-deep: #03081A; --surface: #0A1F3D;
        --ink: #F7F9FC; --muted: #9FAFC2; --hair: rgba(255,255,255,0.10);
        --accent: #00C2C7; --accent-2: #3DDCE3; --glow: #00F5FF;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg-deep); }
      body { font-family: "Lexend", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

      /* Viewport-fixed backdrop: the brand hero gradient. The world pans over it (subtle parallax). */
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background:
          radial-gradient(ellipse 90% 70% at 80% 0%, rgba(0,194,199,0.16), transparent 60%),
          radial-gradient(ellipse 70% 60% at 8% 95%, rgba(61,220,227,0.09), transparent 65%),
          linear-gradient(160deg, #06122A 0%, #0A1F3D 55%, #06122A 100%);
      }

      /* ── The world: one persistent 4200×2100 field; the "camera" is a single transform on it. ── */
      #film { position: absolute; inset: 0; overflow: hidden; }
      #world {
        position: absolute; top: 0; left: 0; width: 4200px; height: 2100px;
        transform-origin: 0 0; will-change: transform;
        background-image:
          linear-gradient(rgba(247,249,252,0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(247,249,252,0.028) 1px, transparent 1px);
        background-size: 120px 120px;
        -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 55%, transparent 100%);
                mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 55%, transparent 100%);
      }

      /* Station-local ambient glows (pre-rendered, so blur is free) */
      .halo { position: absolute; border-radius: 50%; filter: blur(30px); pointer-events: none; }

      /* ── Hub ── */
      /* z-index keeps the ED tile crisp ABOVE the payoff/outro glow blooms (they render later in DOM). */
      #hub { position: absolute; left: 2100px; top: 1050px; width: 0; height: 0; z-index: 5; }
      #hub .tile {
        position: absolute; left: -110px; top: -99px; width: 220px; height: 198px; border-radius: 44px;
        background: linear-gradient(150deg, #00C2C7 0%, #0A1F3D 99%);
        box-shadow: 0 0 0 1px rgba(0,194,199,0.5), 0 24px 80px rgba(0,194,199,0.32);
        display: flex; align-items: center; justify-content: center;
        font-family: "Lexend Zetta", "Lexend", sans-serif; font-weight: 700; font-size: 92px; color: #fff;
      }
      #hub .halo { left: -330px; top: -330px; width: 660px; height: 660px; background: radial-gradient(circle, rgba(0,194,199,0.28), transparent 65%); }
      .pulse-ring {
        position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%;
        border: 3px solid rgba(0,194,199,0.55); opacity: 0;
      }

      /* ── Generic station chrome ── */
      .station { position: absolute; width: 0; height: 0; }
      .st-tile {
        position: absolute; left: -80px; top: -72px; width: 160px; height: 144px; border-radius: 32px;
        background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
        border: 1.5px solid rgba(0,194,199,0.35);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 24px 70px rgba(0,194,199,0.18);
        display: flex; align-items: center; justify-content: center;
      }
      .st-tile svg { width: 76px; height: 76px; stroke: var(--accent-2); }
      .station .halo { left: -240px; top: -240px; width: 480px; height: 480px; background: radial-gradient(circle, rgba(0,194,199,0.16), transparent 65%); }

      /* Agentforce: governance orbit ring + checkpoint node */
      #st-af .orbit {
        position: absolute; left: -140px; top: -140px; width: 280px; height: 280px; border-radius: 50%;
        border: 2.5px dashed rgba(61,220,227,0.4);
      }
      #st-af .checkpoint {
        position: absolute; left: -11px; top: -151px; width: 22px; height: 22px; border-radius: 50%;
        background: var(--surface); border: 2.5px solid rgba(61,220,227,0.5);
      }
      #st-af .checkpoint-fill { position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent); opacity: 0; }

      /* Vela: ROAI gauge + value-vs-cost bars */
      #st-vela .bars { position: absolute; left: 120px; top: -60px; display: flex; gap: 22px; align-items: flex-end; height: 120px; }
      #st-vela .bar { width: 30px; border-radius: 7px 7px 3px 3px; transform-origin: bottom; }
      #st-vela .bar.value { height: 120px; background: linear-gradient(180deg, #3DDCE3 0%, #00C2C7 100%); box-shadow: 0 0 24px rgba(0,194,199,0.35); }
      #st-vela .bar.cost { height: 34px; background: rgba(247,249,252,0.28); }

      /* VaultOS: scattered docs that snap into a governed grid */
      .doc {
        position: absolute; width: 34px; height: 44px; border-radius: 7px;
        background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
        border: 1.5px solid rgba(61,220,227,0.45);
      }
      .doc::after { content: ""; position: absolute; left: 6px; right: 6px; top: 9px; height: 2.5px; background: rgba(61,220,227,0.5); box-shadow: 0 9px 0 rgba(61,220,227,0.35), 0 18px 0 rgba(61,220,227,0.22); }

      /* Beam sweep (constellation pass) — single skewed light bar, one traversal */
      #beam {
        position: absolute; top: 0; bottom: 0; width: 420px; left: 0; opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(124,243,226,0.10) 45%, rgba(0,245,255,0.16) 50%, rgba(124,243,226,0.10) 55%, transparent);
        pointer-events: none;
      }

      /* Payoff gauge glow (arc itself is SVG) */
      #payoff-glow {
        position: absolute; left: 1700px; top: 650px; width: 800px; height: 800px; border-radius: 50%;
        background: radial-gradient(circle, rgba(0,194,199,0.30), transparent 62%); filter: blur(26px); opacity: 0;
      }
      #outro-glow {
        position: absolute; left: 1660px; top: 610px; width: 880px; height: 880px; border-radius: 50%;
        background: radial-gradient(circle, rgba(0,194,199,0.34), transparent 65%); filter: blur(22px); opacity: 0;
      }

      svg.world-layer { position: absolute; left: 0; top: 0; width: 4200px; height: 2100px; overflow: visible; }
      .thread { fill: none; stroke: url(#threadGrad); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(0,194,199,0.45)); }
      .thread-return { fill: none; stroke: rgba(61,220,227,0.55); stroke-width: 3.5; stroke-linecap: round; filter: drop-shadow(0 0 7px rgba(61,220,227,0.35)); }
      .gauge-track { fill: none; stroke: rgba(247,249,252,0.10); stroke-width: 7; }
      .gauge-arc { fill: none; stroke: url(#gaugeGrad); stroke-width: 9; stroke-linecap: round; filter: drop-shadow(0 0 14px rgba(0,194,199,0.5)); }
      .braid { fill: none; stroke: rgba(0,194,199,0.6); stroke-width: 3.5; stroke-linecap: round; }
      .pods-lane { fill: none; stroke: rgba(247,249,252,0.30); stroke-width: 4; stroke-linecap: round; }
      .pods-branch { fill: none; stroke: url(#threadGrad); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(0,194,199,0.4)); }
      .gate {
        position: absolute; width: 30px; height: 30px; transform: rotate(45deg);
        border: 2.5px solid rgba(61,220,227,0.5); border-radius: 7px; background: var(--surface);
      }
      .gate-fill { position: absolute; inset: 4px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 16px var(--accent); opacity: 0; }

      /* Viewport-level vignette — keeps edges cinematic in every exported frame */
      #hf-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 90;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">

      <div id="film" class="clip" data-start="0" data-duration="24" data-track-index="1">
        <!-- The world is intentionally larger than the canvas — the camera pans across it. -->
        <div id="world" data-layout-allow-overflow>

          <!-- ── Thread + station SVG layer (all geometry in world coordinates) ── -->
          <svg class="world-layer" viewBox="0 0 4200 2100" aria-hidden="true">
            <defs>
              <linearGradient id="threadGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#00C2C7" />
                <stop offset="1" stop-color="#3DDCE3" />
              </linearGradient>
              <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#00C2C7" />
                <stop offset="0.6" stop-color="#3DDCE3" />
                <stop offset="1" stop-color="#00F5FF" />
              </linearGradient>
            </defs>

            <!-- Journey thread: hub → AF → Vela → Vault → Pods (drawn leg by leg) -->
            <path id="leg1" class="thread" pathLength="1" d="M 2100 1050 C 2450 950, 2650 780, 2950 600" />
            <path id="leg2" class="thread" pathLength="1" d="M 2950 600 C 3250 800, 3150 1250, 2980 1520" />
            <path id="leg3" class="thread" pathLength="1" d="M 2980 1520 C 2760 1750, 2400 1880, 2050 1900" />
            <path id="leg4" class="thread" pathLength="1" d="M 2050 1900 C 1700 1850, 1450 1650, 1250 1420" />

            <!-- Return threads: each spoke back to the hub (constellation beat) -->
            <path class="thread-return" pathLength="1" d="M 2950 600 C 2600 800, 2350 950, 2100 1050" />
            <path class="thread-return" pathLength="1" d="M 2980 1520 C 2650 1400, 2350 1200, 2100 1050" />
            <path class="thread-return" pathLength="1" d="M 2050 1900 C 2050 1600, 2080 1300, 2100 1050" />
            <path class="thread-return" pathLength="1" d="M 1250 1420 C 1550 1300, 1850 1150, 2100 1050" />

            <!-- Vela ROAI gauge (around the station glyph) -->
            <circle id="vela-gauge-track" class="gauge-track" cx="2980" cy="1520" r="120" />
            <circle id="vela-gauge" class="gauge-arc" pathLength="1" cx="2980" cy="1520" r="120" transform="rotate(-90 2980 1520)" />

            <!-- Dev Pods git lanes -->
            <path id="pods-lane" class="pods-lane" pathLength="1" d="M 1030 1420 L 1470 1420" />
            <path id="pods-branch" class="pods-branch" pathLength="1" d="M 1090 1420 C 1150 1330, 1210 1330, 1250 1330 L 1300 1330 C 1360 1330, 1400 1390, 1440 1416" />

            <!-- Payoff braid: four strands converging into the hub gauge -->
            <path class="braid" pathLength="1" d="M 1880 830 C 1980 890, 2030 950, 2065 990" />
            <path class="braid" pathLength="1" d="M 2320 830 C 2220 890, 2170 950, 2135 990" />
            <path class="braid" pathLength="1" d="M 1860 1270 C 1970 1220, 2030 1160, 2062 1115" />
            <path class="braid" pathLength="1" d="M 2340 1270 C 2230 1220, 2170 1160, 2138 1115" />

            <!-- Payoff gauge: a large ring around the hub itself — the journey returns home -->
            <circle id="hub-gauge-track" class="gauge-track" cx="2100" cy="1050" r="210" />
            <circle id="hub-gauge" class="gauge-arc" pathLength="1" cx="2100" cy="1050" r="210" transform="rotate(-90 2100 1050)" style="stroke-width: 12;" />
          </svg>

          <!-- ── Hub station ── -->
          <div id="hub">
            <div class="halo" data-halo></div>
            <div class="pulse-ring" data-pulse="1"></div>
            <div class="pulse-ring" data-pulse="2"></div>
            <div class="tile">ED</div>
          </div>

          <!-- ── Agentforce station (spark + governance orbit) ── -->
          <div id="st-af" class="station" style="left: 2950px; top: 600px;">
            <div class="halo"></div>
            <div class="orbit"></div>
            <div class="checkpoint"><div class="checkpoint-fill"></div></div>
            <div class="st-tile">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l2 5.5L19 10l-5 1.5L12 17l-2-5.5L5 10l5-1.5z" />
                <path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" />
              </svg>
            </div>
          </div>

          <!-- ── Vela OS / ROAI station (gauge is SVG above; bars here) ── -->
          <div id="st-vela" class="station" style="left: 2980px; top: 1520px;">
            <div class="halo"></div>
            <div class="st-tile">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4a8 8 0 1 0 8 8" />
                <path d="M12 12l5.5-4" />
                <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
              </svg>
            </div>
            <div class="bars">
              <div class="bar value" data-bar-value></div>
              <div class="bar cost" data-bar-cost></div>
            </div>
          </div>

          <!-- ── VaultOS station (docs snap into governance) ── -->
          <div id="st-vault" class="station" style="left: 2050px; top: 1900px;">
            <div class="halo"></div>
            <div class="st-tile">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="5" width="16" height="14" rx="2.5" />
                <circle cx="12" cy="12" r="3.2" />
                <path d="M12 8.8v-1.6M12 16.8v-1.6M8.8 12H7.2M16.8 12h-1.6" />
              </svg>
            </div>
            <!-- 12 documents; scattered offsets are set (deterministically) from the timeline -->
            <div class="doc" data-doc="0"></div><div class="doc" data-doc="1"></div>
            <div class="doc" data-doc="2"></div><div class="doc" data-doc="3"></div>
            <div class="doc" data-doc="4"></div><div class="doc" data-doc="5"></div>
            <div class="doc" data-doc="6"></div><div class="doc" data-doc="7"></div>
            <div class="doc" data-doc="8"></div><div class="doc" data-doc="9"></div>
            <div class="doc" data-doc="10"></div><div class="doc" data-doc="11"></div>
          </div>

          <!-- ── Dev Pods station (lanes are SVG above; gate diamond here) ── -->
          <div id="st-pods" class="station" style="left: 1250px; top: 1420px;">
            <div class="halo"></div>
            <div class="gate" style="left: 45px; top: -105px;"><div class="gate-fill"></div></div>
            <div class="st-tile" style="left: -80px; top: 40px;">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="2.2" /><circle cx="6" cy="18" r="2.2" /><circle cx="18" cy="12" r="2.2" />
                <path d="M6 8.2v7.6M8 6.6c4 1 7.5 2.4 8 3.6M8 17.4c4-1 7.5-2.4 8-3.6" />
              </svg>
            </div>
          </div>

          <!-- Constellation beam + payoff glows (world-space) -->
          <div id="beam"></div>
          <div id="payoff-glow"></div>
          <div id="outro-glow"></div>
        </div>
      </div>

      <div id="hf-vignette"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ── Camera: one transform on #world. camTo(wx, wy, z) frames world-point (wx,wy)
         at viewport center (960, 540). transform-origin is 0 0, so:
         translate = viewportCenter − worldPoint × zoom. ── */
      const cam = (wx, wy, z) => ({ x: 960 - wx * z, y: 540 - wy * z, scale: z });
      const HUB = [2100, 1050], AF = [2950, 600], VELA = [2980, 1520], VAULT = [2050, 1900], PODS = [1250, 1420];

      // Rest state (beat 1 opening frame) — set BEFORE any tween so t=0 is composed.
      gsap.set("#world", cam(...HUB, 1.42));

      /* Camera choreography. Position eases in-out-quart between stations; zoom "breathes"
         (dips during travel) on its own tween pair so dolly speed stays scrub-friendly. */
      const move = (t, dur, from, to, zRest) => {
        // position (single tween; x/y both derived from the *destination* zoom)
        tl.to("#world", { ...cam(to[0], to[1], zRest), duration: dur, ease: "power2.inOut" }, t);
        // zoom dip: overwrite scale only, down then back up, while position glides
        tl.to("#world", { scale: 1.0, duration: dur * 0.5, ease: "quint.out", overwrite: false }, t);
        tl.to("#world", { scale: zRest, duration: dur * 0.5, ease: "quint.inOut" }, t + dur * 0.5);
      };

      // B1 hold + gentle push (0 – 2.4)
      tl.to("#world", { ...cam(...HUB, 1.52), duration: 1.6, ease: "quint.out" }, 0);
      // B2 → Agentforce (2.4 – 4.4), plateau to 5.28
      move(2.4, 2.0, HUB, AF, 1.5);
      // B3 → Vela (5.28 – 7.28), plateau to 8.4
      move(5.28, 2.0, AF, VELA, 1.5);
      // B4 → Vault (8.4 – 10.4), plateau to 11.28
      move(8.4, 2.0, VELA, VAULT, 1.5);
      // B5 → Pods (11.28 – 13.28), plateau to 14.16
      move(11.28, 2.0, VAULT, PODS, 1.5);
      // B6 pull-back to constellation (14.16 – 16.0), plateau to 17.28
      tl.to("#world", { ...cam(...HUB, 0.42), duration: 1.84, ease: "power2.inOut" }, 14.16);
      // B7 push into the payoff (17.28 – 19.28), long plateau to 21.12
      tl.to("#world", { ...cam(...HUB, 1.02), duration: 2.0, ease: "power2.inOut" }, 17.28);
      // B8 final settle (21.12 – 22.6), pure hold to 24
      tl.to("#world", { ...cam(...HUB, 1.26), duration: 1.48, ease: "quint.inOut" }, 21.12);

      /* ── Draw helper: pathLength="1" paths draw via dashoffset 1 → 0 ── */
      const draw = (sel, t, dur, ease = "none") => {
        tl.set(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
        tl.to(sel, { strokeDashoffset: 0, duration: dur, ease }, t);
      };

      /* ── B1: hub ignition (0 – 2.4) ── */
      tl.from("#hub .tile", { opacity: 0, scale: 0.82, duration: 0.7, ease: "back.out(1.5)" }, 0.15);
      tl.from("#hub [data-halo]", { opacity: 0, duration: 0.9, ease: "quint.out" }, 0.2);
      tl.fromTo("#hub [data-pulse='1']", { opacity: 0.8, scale: 0.45 }, { opacity: 0, scale: 2.1, duration: 1.4, ease: "power2.out" }, 0.9);
      tl.fromTo("#hub [data-pulse='2']", { opacity: 0.7, scale: 0.45 }, { opacity: 0, scale: 2.3, duration: 1.4, ease: "power2.out" }, 1.5);

      /* ── B2: thread → Agentforce; governance checkpoint lights (2.3 – 5.28) ── */
      draw("#leg1", 2.3, 1.9);
      tl.from("#st-af .st-tile", { opacity: 0, scale: 0.86, duration: 0.6, ease: "expo.out" }, 3.4);
      tl.from("#st-af .halo", { opacity: 0, duration: 0.7 }, 3.4);
      tl.from("#st-af .orbit", { opacity: 0, rotate: -40, duration: 1.1, ease: "quint.out" }, 3.55);
      tl.fromTo("#st-af .checkpoint-fill", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.35);

      /* ── B3: Vela — ROAI gauge fills, value-vs-cost bars (5.2 – 8.4) ── */
      draw("#leg2", 5.2, 1.9);
      tl.from("#st-vela .st-tile", { opacity: 0, scale: 0.86, duration: 0.6, ease: "expo.out" }, 6.3);
      tl.from("#st-vela .halo", { opacity: 0, duration: 0.7 }, 6.3);
      tl.set("#vela-gauge", { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
      tl.to("#vela-gauge", { strokeDashoffset: 0.28, duration: 0.95, ease: "power2.out" }, 6.55); // fills to 72%
      tl.from("#st-vela [data-bar-value]", { scaleY: 0, duration: 0.55, ease: "quint.out" }, 6.6);
      tl.from("#st-vela [data-bar-cost]", { scaleY: 0, duration: 0.45, ease: "quint.out" }, 6.8);

      /* ── B4: VaultOS — scattered docs snap into a governed grid (8.3 – 11.28) ── */
      draw("#leg3", 8.3, 1.9);
      tl.from("#st-vault .st-tile", { opacity: 0, scale: 0.86, duration: 0.6, ease: "expo.out" }, 9.25);
      tl.from("#st-vault .halo", { opacity: 0, duration: 0.7 }, 9.25);
      // Grid targets: two arcs of 6 docs flanking the vault glyph. Scattered origins are
      // fixed offsets (deterministic — no randomness allowed in a frame).
      const GRID = [
        [-150, -120], [-96, -158], [-38, -178], [38, -178], [96, -158], [150, -120],
        [-150, 46], [-96, 84], [-38, 104], [38, 104], [96, 84], [150, 46]
      ];
      const SCATTER = [
        [-320, -270], [-180, -340], [-30, -390], [130, -350], [270, -280], [360, -160],
        [-360, 120], [-240, 230], [-70, 300], [90, 310], [250, 240], [370, 130]
      ];
      GRID.forEach((g, i) => {
        const s = SCATTER[i];
        tl.set(`#st-vault [data-doc="${i}"]`, { x: s[0], y: s[1], opacity: 0.45, rotate: (i % 2 ? 14 : -12) }, 0);
        tl.to(`#st-vault [data-doc="${i}"]`, { x: g[0] - 17, y: g[1] - 22, opacity: 1, rotate: 0, duration: 0.5, ease: "quint.out" }, 9.3 + i * 0.055);
      });

      /* ── B5: Dev Pods — branch, gate, merge (11.2 – 14.16) ── */
      draw("#leg4", 11.2, 1.9);
      tl.from("#st-pods .st-tile", { opacity: 0, scale: 0.86, duration: 0.6, ease: "expo.out" }, 12.1);
      tl.from("#st-pods .halo", { opacity: 0, duration: 0.7 }, 12.1);
      draw("#pods-lane", 12.15, 0.55, "power1.out");
      draw("#pods-branch", 12.35, 0.6, "power1.out");
      tl.fromTo("#st-pods .gate-fill", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 12.8);

      /* ── B6: pull-back constellation — return threads + one beam sweep (14.16 – 17.28) ── */
      document.querySelectorAll(".thread-return").forEach((el, i) => {
        tl.set(el, { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
        tl.to(el, { strokeDashoffset: 0, duration: 1.1, ease: "power1.inOut" }, 15.0 + i * 0.15);
      });
      tl.fromTo("#beam", { opacity: 0, x: -500, skewX: -10 }, { opacity: 1, x: 1200, skewX: -10, duration: 0.5, ease: "none" }, 16.2)
        .to("#beam", { x: 4400, opacity: 0, duration: 0.7, ease: "none" }, 16.7);

      /* ── B7: payoff — strands braid into the hub gauge; arc tracks progress (17.28 – 21.12) ── */
      document.querySelectorAll(".braid").forEach((el, i) => {
        tl.set(el, { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
        tl.to(el, { strokeDashoffset: 0, duration: 0.8, ease: "power1.out" }, 17.5 + i * 0.12);
      });
      tl.from("#hub-gauge-track", { opacity: 0, duration: 0.5 }, 17.6);
      tl.set("#hub-gauge", { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
      tl.to("#hub-gauge", { strokeDashoffset: 0.2, duration: 2.5, ease: "none" }, 17.7); // 80% arc, scrub-linear
      tl.fromTo("#payoff-glow", { opacity: 0 }, { opacity: 1, duration: 2.2, ease: "power1.in" }, 17.9);

      /* ── B8: close — gauge resolves home; outro bloom; pure hold from 22.6 ── */
      tl.to(["#hub-gauge", "#hub-gauge-track"], { opacity: 0.22, duration: 1.1, ease: "quint.inOut" }, 21.3);
      tl.to("#payoff-glow", { opacity: 0, duration: 1.0 }, 21.3);
      tl.fromTo("#outro-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.3, ease: "power2.out" }, 21.5);
      tl.to("#hub .tile", { boxShadow: "0 0 0 1px rgba(0,194,199,0.7), 0 0 120px rgba(0,194,199,0.5)", duration: 1.2, ease: "quint.out" }, 21.6);

      // Ensure the timeline spans the full 24s even though the last tween ends earlier (pure hold).
      tl.set("#world", {}, 24);

      window.__timelines["main"] = tl;
    </script>
